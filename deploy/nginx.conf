# 生产环境 Nginx 配置（§12.2 公网样板间形态）
# 前端静态文件 + 后端 API 反向代理

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    client_max_body_size 100m;  # 文件上传

    # 限流（防 LLM Key 被刷，§12.4）
    limit_req_zone $binary_remote_addr zone=mfg_api:10m rate=20r/m;

    upstream mfg_backend {
        server backend:8000;
    }

    server {
        listen       80;
        server_name  _;

        # 前端静态文件
        root   /usr/share/nginx/html;
        index  index.html;

        # SPA 路由回退
        location / {
            try_files $uri $uri/ /index.html;
        }

        # API 反代
        location /api/ {
            limit_req zone=mfg_api burst=10 nodelay;
            proxy_pass http://mfg_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # SSE 流式：关闭缓冲，保持长连接
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }
    }
}
